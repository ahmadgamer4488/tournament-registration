<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punjab College Game Tournament Registration</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0f17;
       font-family:system-ui,sans-serif;color:#e8eaf2;padding:20px 0}
  .card{width:min(440px,92vw);background:#161a26;padding:28px;border-radius:14px;border:1px solid #2a3047}
  h1{margin:0 0 4px;font-size:24px} p.sub{margin:0 0 12px;color:#8b93b0}
  label{display:block;margin:14px 0 6px;font-size:13px;color:#aab1cc}
  input,select{width:100%;padding:11px;border-radius:8px;border:1px solid #2a3047;
       background:#0d0f17;color:#fff;font-size:15px;box-sizing:border-box}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;
       background:#6c5ce7;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #msg{margin-top:16px;font-size:14px;text-align:center}
  #info{margin-top:12px;background:#0d0f17;border:1px solid #2a3047;border-radius:8px;
        padding:12px;font-size:14px;display:none;line-height:1.7}
  .ok{color:#2ecc71}.err{color:#ff6b6b}.warn{color:#f1c40f}
</style>
</head>
<body>
<div class="card">
  <h1>🏆 Punjab College Game Tournament</h1>
  <p class="sub">One registration per player</p>
  <form id="f">
    <label>Full Name (No Symbols Allowed)</label>
    <input id="name" required pattern="[A-Za-z ]{2,50}" title="Letters and spaces only, 2-50 characters">
    <label>Email</label>
    <input id="email" type="email" required>
    <label>Institute Roll No</label>
    <input id="roll" required pattern="[A-Za-z0-9/\-]{1,20}" title="Letters, numbers, / or -, 1-20 characters">
    <label>Game (choose one)</label>
    <select id="game" required>
      <option value="">Select game</option>
      <option>Chess</option><option>Cricket</option><option>Football</option>
      <option>Wrestling</option><option>Cycling</option><option>Hockey</option>
    </select>
    <div class="row">
      <div><label>Kit Size</label>
        <select id="kit" required>
          <option value="">Select</option>
          <option>Small</option><option>Med</option><option>Large</option>
          <option>XL</option><option>2XL</option><option>3XL</option>
        </select></div>
      <div><label>Shoe Size</label>
        <select id="shoe" required><option value="">Select</option></select></div>
    </div>
    <button id="btn" type="submit">Register</button>
  </form>
  <div id="msg"></div>
  <div id="info"></div>
</div>

<script>
const WEBHOOK_URL = "https://ahmadgamerplayz.app.n8n.cloud/webhook/tournament-register";

const $ = id => document.getElementById(id);
for (let s = 30; s <= 50; s++) $("shoe").add(new Option(s, s));

function showInfo(d){
  const box = $("info");
  box.innerHTML = "";
  [["Name", d.name],["Roll No", d.roll],["Game", d.game],["Kit", d.kit],["Shoe", d.shoe]]
    .filter(([,v]) => v !== undefined && v !== null)
    .forEach(([k,v]) => {
      const p = document.createElement("div");
      p.textContent = k + ": " + v;
      box.appendChild(p);
    });
  box.style.display = "block";
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("btn"), msg = $("msg");
  if (btn.disabled) return;
  btn.disabled = true; msg.className = ""; msg.textContent = "Submitting..."; $("info").style.display = "none";

  const data = { name:$("name").value, email:$("email").value, roll:$("roll").value,
                 game:$("game").value, kit:$("kit").value, shoe:$("shoe").value };
  try {
    const res = await fetch(WEBHOOK_URL, { method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(data) });
    const out = await res.json();
    if (out.status === "success") {
      msg.className="ok"; msg.textContent="✅ Registration received! Check your email.";
      showInfo(out.data); e.target.reset();
    } else if (out.status === "duplicate") {
      msg.className="warn"; msg.textContent="⚠️ You are already registered. Your saved details are below:";
      showInfo(out.data);
    } else {
      const why = Array.isArray(out.errors) ? out.errors.join(", ") : (out.message || "Please check your details and try again.");
      msg.className="err"; msg.textContent="❌ " + why;
    }
  } catch {
    msg.className="err"; msg.textContent="❌ Server error. Try again later.";
  }
  btn.disabled = false;
});
</script>
</body>
</html>
